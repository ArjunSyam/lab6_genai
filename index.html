<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- CSS: Retro 70s diner / vintage calculator vibe -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #e8dfd4;
      background-image: radial-gradient(#d4c4b0 1px, transparent 1px), radial-gradient(#d4c4b0 1px, #e8dfd4 1px);
      background-size: 24px 24px; background-position: 0 0, 12px 12px;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: linear-gradient(180deg, #faf6f0 0%, #f0e6dc 100%);
      border: 4px solid #5c4033;
      border-radius: 4px;
      padding: 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 8px 8px 0 #5c4033, inset 0 1px 0 rgba(255,255,255,0.8);
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem; letter-spacing: 3px;
      color: #5c4033; margin-bottom: 24px; text-align: center;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
    }
    label { display: block; color: #5c4033; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
    input[type="number"] {
      width: 100%; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 600;
      border: 3px solid #5c4033; border-radius: 2px;
      background: #fff8f0; color: #3d2914;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
    }
    input[type="range"] {
      width: 100%; margin: 10px 0; height: 10px;
      -webkit-appearance: none; appearance: none;
      background: #d4c4b0; border-radius: 2px; border: 2px solid #5c4033;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px;
      background: #c45c3e; border: 2px solid #5c4033;
      border-radius: 2px; cursor: pointer;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px;
      background: #c45c3e; border: 2px solid #5c4033;
      border-radius: 2px; cursor: pointer;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    }
    .slider-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .slider-row input[type="number"] { width: 70px; }
    button {
      width: 100%; padding: 16px; margin-top: 22px;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.25rem; letter-spacing: 2px;
      background: linear-gradient(180deg, #c45c3e 0%, #a04a32 100%);
      color: #fff8f0; border: 3px solid #5c4033;
      border-radius: 2px; cursor: pointer;
      box-shadow: 4px 4px 0 #5c4033;
      transition: all 0.15s ease;
    }
    button:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #5c4033; background: linear-gradient(180deg, #d46848 0%, #b85538 100%); }
    button:active { transform: translate(4px, 4px); box-shadow: none; }
    .result {
      margin-top: 24px; padding: 16px;
      background: #fff8f0; border: 3px solid #5c4033; border-radius: 2px;
      box-shadow: inset 0 0 0 2px #d4c4b0;
    }
    .result p { color: #5c4033; margin-bottom: 8px; font-size: 0.8rem; letter-spacing: 1px; }
    .result strong { color: #3d2914; font-size: 1.2rem; }
    .error {
      margin-top: 12px; padding: 12px;
      background: #ffebe8; border: 3px solid #c45c3e; border-radius: 2px;
      color: #8b3a2a; font-size: 0.85rem; display: none;
    }
    .tip-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .tip-btns button { width: auto; flex: 1; min-width: 60px; padding: 10px; margin: 0; font-size: 0.9rem; }
    .split-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .split-row input { width: 60px; text-align: center; }
    .split-row label { margin: 0; display: flex; align-items: center; gap: 8px; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; margin-top: 14px; cursor: pointer; }
    .checkbox-wrap input { width: 18px; height: 18px; cursor: pointer; accent-color: #c45c3e; }
    .result .per-person { margin-top: 10px; padding-top: 10px; border-top: 2px dashed #d4c4b0; }
  </style>
</head>
<body>
  <!-- Main card container - holds all inputs and results -->
  <div class="card">
    <h1>Tip Calculator</h1>
    <!-- Bill amount input -->
    <label for="bill">Bill Amount ($)</label>
    <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
    <!-- Quick tip presets -->
    <label>Quick Tip</label>
    <div class="tip-btns">
      <button type="button" onclick="setTip(10)">10%</button>
      <button type="button" onclick="setTip(15)">15%</button>
      <button type="button" onclick="setTip(20)">20%</button>
      <button type="button" onclick="setTip(25)">25%</button>
    </div>
    <!-- Tip percentage: slider + number input synced -->
    <label for="tip">Tip Percentage (%)</label>
    <div class="slider-row">
      <input type="range" id="tip" min="0" max="50" value="15" oninput="syncTip(this.value)">
      <input type="number" id="tipVal" min="0" max="50" value="15" style="text-align:center" oninput="syncTip(this.value)">
    </div>
    <!-- Split bill -->
    <div class="split-row">
      <label for="split">Split between</label>
      <input type="number" id="split" min="1" value="1" placeholder="1">
      <span style="color:#5c4033;font-size:0.8rem">people</span>
    </div>
    <!-- Round up option -->
    <label class="checkbox-wrap">
      <input type="checkbox" id="roundUp">
      <span style="color:#5c4033;font-size:0.85rem">Round total up to nearest dollar</span>
    </label>
    <button onclick="calculate()">Calculate Tip</button>
    <!-- Error message: shown when validation fails -->
    <div class="error" id="error"></div>
    <!-- Results shown here -->
    <div class="result" id="result" style="display:none">
      <p>Tip Amount: <strong id="tipAmount">$0.00</strong></p>
      <p>Total Amount: <strong id="total">$0.00</strong></p>
      <p class="per-person" id="perPersonWrap" style="display:none">Per Person: <strong id="perPerson">$0.00</strong></p>
    </div>
  </div>
  <!-- JavaScript -->
  <script>
    function syncTip(val) {
      document.getElementById('tip').value = val;
      document.getElementById('tipVal').value = val;
    }
    function setTip(pct) {
      syncTip(pct);
    }
    function format(n) { return '$' + n.toFixed(2); }

    function calculate() {
      var billInput = document.getElementById('bill').value.trim();
      var tipInput = document.getElementById('tip').value.trim();
      var splitInput = document.getElementById('split').value.trim();
      var bill = parseFloat(billInput);
      var tipPct = parseFloat(tipInput);
      var split = parseInt(splitInput, 10) || 1;
      var roundUp = document.getElementById('roundUp').checked;
      var errEl = document.getElementById('error');
      var resultEl = document.getElementById('result');

      if (billInput === '' || isNaN(bill) || bill < 0) {
        errEl.textContent = 'Please enter a valid bill amount (positive number).';
        errEl.style.display = 'block';
        resultEl.style.display = 'none';
        return;
      }
      if (tipInput === '' || isNaN(tipPct) || tipPct < 0) {
        errEl.textContent = 'Please enter a valid tip percentage (positive number).';
        errEl.style.display = 'block';
        resultEl.style.display = 'none';
        return;
      }
      if (split < 1) {
        errEl.textContent = 'Split must be at least 1 person.';
        errEl.style.display = 'block';
        resultEl.style.display = 'none';
        return;
      }

      errEl.style.display = 'none';
      var tip = bill * (tipPct / 100);
      var total = bill + tip;
      if (roundUp) {
        total = Math.ceil(total);
        tip = total - bill;  // tip includes the round-up amount
      }

      document.getElementById('tipAmount').textContent = format(tip);
      document.getElementById('total').textContent = format(total);

      var perPersonWrap = document.getElementById('perPersonWrap');
      if (split > 1) {
        var perPerson = total / split;
        document.getElementById('perPerson').textContent = format(perPerson);
        perPersonWrap.style.display = 'block';
      } else {
        perPersonWrap.style.display = 'none';
      }
      resultEl.style.display = 'block';
    }
  </script>
</body>
</html>
